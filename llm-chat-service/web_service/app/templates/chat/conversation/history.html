<script>
// ... существующий код ...

// SSE подключение для real-time обновлений
let eventSource = null;
let reconnectAttempts = 0;
const maxReconnectAttempts = 5;

function connectSSE() {
    if (eventSource) {
        eventSource.close();
    }

    const sseUrl = `/chat/conversation/${conversationId}/stream`;
    eventSource = new EventSource(sseUrl);

    eventSource.onopen = function() {
        console.log('SSE connection opened');
        reconnectAttempts = 0;
    };

    eventSource.onmessage = async function(event) {
        try {
            const data = JSON.parse(event.data);
            console.log('Received SSE message:', data);

            // Обрабатываем сообщение из очереди
            if (data.message_id) {
                // Проверяем, есть ли уже такое сообщение в чате
                const existingMessage = document.querySelector(`[data-message-id="${data.message_id}"]`);

                if (!existingMessage) {
                    // Запрашиваем новое сообщение
                    await fetchAndAddMessage(data.message_id);
                } else {
                    // Обновляем статус существующего сообщения
                    await updateMessageStatus(data.message_id, data.status);
                }
            }
        } catch (error) {
            console.error('Error processing SSE message:', error);
        }
    };

    eventSource.onerror = function(event) {
        console.error('SSE connection error:', event);
        eventSource.close();

        // Пытаемся переподключиться
        if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
            console.log(`Reconnecting in ${delay}ms... (attempt ${reconnectAttempts})`);
            setTimeout(connectSSE, delay);
        } else {
            console.error('Max reconnection attempts reached');
            showReconnectionError();
        }
    };
}

// Функция для получения и добавления сообщения
async function fetchAndAddMessage(messageId) {
    try {
        const response = await fetch(`/chat/message/${messageId}`);
        if (response.ok) {
            const messageData = await response.json();

            // Определяем тип отправителя
            const role = messageData.sender_type === 'user' ? 'user' : 'assistant';

            // Проверяем, не добавлено ли уже сообщение
            const existingMessage = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!existingMessage) {
                addMessage(role, messageData.content, messageId, messageData.status);
            }
        }
    } catch (error) {
        console.error('Error fetching message:', error);
    }
}

// Обновленная функция обновления статуса
async function updateMessageStatus(messageId, status) {
    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    if (messageElement) {
        const statusSpan = messageElement.querySelector('.message-status');
        if (statusSpan) {
            updateStatusUI(statusSpan, status);
        }
    }
}

// Выносим логику обновления UI статуса
function updateStatusUI(statusSpan, status) {
    switch(status) {
        case 'processing':
            statusSpan.textContent = '⏳ Обработка...';
            statusSpan.className = 'message-status status-processing';
            break;
        case 'delivered':
            statusSpan.textContent = '✓ Доставлено';
            statusSpan.className = 'message-status status-delivered';
            break;
        case 'read':
            statusSpan.textContent = '✓✓ Прочитано';
            statusSpan.className = 'message-status status-delivered';
            break;
        case 'failed':
            statusSpan.textContent = '❌ Ошибка';
            statusSpan.className = 'message-status status-failed';
            break;
        default:
            if (status === 'done') {
                statusSpan.textContent = '✓ Готово';
                statusSpan.className = 'message-status status-delivered';
            }
    }
}

// Показываем ошибку при проблемах с подключением
function showReconnectionError() {
    const errorAlert = document.createElement('div');
    errorAlert.className = 'alert alert-warning alert-dismissible fade show';
    errorAlert.innerHTML = `
        <strong>⚠️ Проблемы с подключением</strong><br>
        Real-time обновления временно недоступны.
        <button class="btn btn-sm btn-outline-primary ms-2" onclick="connectSSE()">
            Переподключиться
        </button>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    messagesArea.insertBefore(errorAlert, messagesArea.firstChild);

    // Автоматическое исчезновение через 10 секунд
    setTimeout(() => {
        if (errorAlert.parentNode) {
            errorAlert.remove();
        }
    }, 10000);
}

// Функция для проверки наличия новых сообщений (fallback)
let pollingInterval = null;

function startPollingFallback() {
    // Используем polling как fallback если SSE не работает
    if (pollingInterval) {
        clearInterval(pollingInterval);
    }

    pollingInterval = setInterval(async () => {
        // Получаем последнее сообщение
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const currentLimit = urlParams.get('limit') || '10';
            const response = await fetch(`/chat/conversation/${conversationId}/messages?limit=${currentLimit}&page=1`);
            if (response.ok) {
                const data = await response.json();
                // Сравниваем с текущим количеством сообщений
                const currentMessageCount = document.querySelectorAll('.message').length;
                if (data.messages && data.messages.length > currentMessageCount) {
                    // Обновляем страницу при появлении новых сообщений
                    window.location.reload();
                }
            }
        } catch (error) {
            console.error('Polling error:', error);
        }
    }, 5000); // Проверяем каждые 5 секунд
}

// Инициализация SSE при загрузке страницы
document.addEventListener('DOMContentLoaded', () => {
    connectSSE();

    // Запускаем polling fallback с задержкой
    setTimeout(() => {
        if (!eventSource || eventSource.readyState === EventSource.CLOSED) {
            console.log('Starting polling fallback');
            startPollingFallback();
        }
    }, 5000);
});

// Очищаем ресурсы при уходе со страницы
window.addEventListener('beforeunload', () => {
    if (eventSource) {
        eventSource.close();
    }
    if (pollingInterval) {
        clearInterval(pollingInterval);
    }
});

// Обновляем функцию отправки сообщения для немедленного отображения
async function sendMessage() {
    const content = messageInput.value.trim();
    if (!content) return;

    // Добавляем сообщение пользователя в UI
    const tempMessageId = addTemporaryMessage('user', content);
    messageInput.value = '';
    sendBtn.disabled = true;

    // Показываем индикатор печатания
    typingIndicator.style.display = 'block';
    scrollToBottom();

    try {
        const temperature = temperatureSlider.value;
        const formData = new URLSearchParams();
        formData.append('content', content);
        formData.append('temperature', temperature);

        const response = await fetch(`/chat/conversation/${conversationId}/query`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData
        });

        if (response.ok) {
            const data = await response.json();
            // Обновляем временное сообщение
            updateMessageWithId(tempMessageId, data.user_message_id);
            // Не ждем ответ через polling, SSE принесет ответ
        } else {
            const errorText = await response.text();
            addMessage('assistant', `❌ Ошибка: ${response.status} - ${errorText}`, null, 'failed');
        }
    } catch (error) {
        addMessage('assistant', `❌ Ошибка соединения: ${error.message}`, null, 'failed');
    } finally {
        typingIndicator.style.display = 'none';
        sendBtn.disabled = false;
        messageInput.focus();
    }
}

// Удаляем функцию waitForAssistantResponse, так как SSE заменит polling
// И обновляем функцию updateMessageWithId
function updateMessageWithId(tempId, realId) {
    const tempMessage = document.querySelector(`[data-temp-id="${tempId}"]`);
    if (tempMessage) {
        tempMessage.removeAttribute('data-temp-id');
        tempMessage.setAttribute('data-message-id', realId);
        const statusSpan = tempMessage.querySelector('.message-status');
        if (statusSpan) {
            statusSpan.textContent = '✓ Отправлено';
            statusSpan.className = 'message-status status-delivered';
        }
    }
}
</script>
